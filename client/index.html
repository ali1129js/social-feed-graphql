<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Social feed demo with a GraphQL API. Fictional people and posts only."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Social Feed</title>
    <script>
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem("social-feed.v1.theme") || '"graphite"');
          if (theme !== "khaki" && theme !== "graphite" && theme !== "midnight") theme = "graphite";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === "khaki" ? "light" : "dark";
          var locale = JSON.parse(localStorage.getItem("social-feed.v1.locale") || '"en"');
          if (locale === "de" || locale === "en") document.documentElement.lang = locale;
        } catch (e) {
          document.documentElement.dataset.theme = "graphite";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
